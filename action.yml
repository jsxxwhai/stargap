name: stargap
description: Audit your repository's discoverability and find high-star awesome lists that should mention it.
author: stargap contributors

inputs:
  repo:
    description: Target repository in owner/name form. Defaults to the current repository.
    required: false
    default: ""
  mode:
    description: "audit scores the repository and produces fixes; gaps only reports missing curated lists."
    required: false
    default: audit
  token:
    description: GitHub token used for search and API requests. Defaults to the workflow token.
    required: false
    default: ""
  min-stars:
    description: Ignore candidate lists below this star count.
    required: false
    default: "1000"
  limit:
    description: Maximum number of gaps to report.
    required: false
    default: "20"
  candidates:
    description: Maximum number of search hits to inspect.
    required: false
    default: "40"
  query:
    description: Override the generated GitHub search query.
    required: false
    default: ""
  output:
    description: Report path, relative to the workspace.
    required: false
    default: stargap-report.md
  badge-output:
    description: Optional SVG badge path. Only available in audit mode.
    required: false
    default: ""
  fail-under:
    description: Optional score threshold. Audit mode exits non-zero below it.
    required: false
    default: ""

outputs:
  report:
    description: Path to the generated Markdown report.
    value: ${{ steps.scan.outputs.report }}
  score:
    description: Discoverability score from 0 to 100 (audit mode).
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: Letter grade from F to A+ (audit mode).
    value: ${{ steps.scan.outputs.grade }}
  badge:
    description: Path to the generated SVG badge, when requested.
    value: ${{ steps.scan.outputs.badge }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_MIN_STARS: ${{ inputs.min-stars }}
        INPUT_LIMIT: ${{ inputs.limit }}
        INPUT_CANDIDATES: ${{ inputs.candidates }}
        INPUT_QUERY: ${{ inputs.query }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_BADGE_OUTPUT: ${{ inputs.badge-output }}
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
      run: node "${{ github.action_path }}/bin/action.mjs"

branding:
  icon: search
  color: purple
