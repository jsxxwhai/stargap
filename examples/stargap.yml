name: Find awesome-list gaps

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stargap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jsxxwhai/stargap@v0.1.0
        id: stargap
        with:
          min-stars: "1000"
          limit: "20"
          output: stargap-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: stargap-report
          path: ${{ steps.stargap.outputs.report }}