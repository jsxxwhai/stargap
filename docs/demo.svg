<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">stargap terminal demo</title>
  <desc id="desc">stargap finds a high-star Python awesome list that does not yet mention Ruff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1100" height="600" rx="28" fill="url(#bg)"/>
  <rect x="52" y="48" width="996" height="504" rx="18" fill="#0b1120" stroke="#334155" filter="url(#shadow)"/>
  <rect x="52" y="48" width="996" height="52" rx="18" fill="#172033"/>
  <circle cx="86" cy="74" r="7" fill="#fb7185"/>
  <circle cx="110" cy="74" r="7" fill="#fbbf24"/>
  <circle cx="134" cy="74" r="7" fill="#34d399"/>
  <text x="170" y="80" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">stargap</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="88" y="145" fill="#a5b4fc" font-size="18">$ npx stargap astral-sh/ruff --min-stars 300 --limit 6</text>
    <text x="88" y="205" fill="#f8fafc" font-size="22" font-weight="700">stargap — astral-sh/ruff</text>
    <text x="88" y="237" fill="#94a3b8" font-size="17">1 high-star repo that could list you but does not yet</text>
    <text x="88" y="299" fill="#fbbf24" font-size="20" font-weight="700">1.</text>
    <text x="126" y="299" fill="#fbbf24" font-size="20" font-weight="700">51.8</text>
    <text x="215" y="299" fill="#e2e8f0" font-size="20" font-weight="700">31k</text>
    <text x="290" y="299" fill="#7dd3fc" font-size="20" font-weight="700">jobbole/awesome-python-cn</text>
    <text x="126" y="334" fill="#94a3b8" font-size="16">curated list · section: 代码分析和 Lint 工具 · 30,602 stars</text>
    <text x="126" y="375" fill="#cbd5e1" font-size="16">Python资源大全中文版，包括：Web框架、网络爬虫、模板引擎、</text>
    <text x="126" y="402" fill="#cbd5e1" font-size="16">数据库、数据可视化、图片处理等</text>
    <text x="88" y="482" fill="#34d399" font-size="17">Next: stargap astral-sh/ruff --markdown --out GAPS.md</text>
  </g>
  <rect x="760" y="500" width="240" height="30" rx="15" fill="#1e293b"/>
  <text x="880" y="520" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">zero dependencies · Node 18+</text>
</svg>